$kind: http-request
name: Login Admin
method: POST
url: '{{baseUrl}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@yoedu.com",
      "password": "admin123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("admin login succeeds", function () {
        pm.response.to.have.status(200);
      });

      var res = pm.response.json();

      if (res.accessToken) {
        pm.environment.set("accessToken", res.accessToken);
      }
      if (res.refreshToken) {
        pm.environment.set("refreshToken", res.refreshToken);
      }

