spring.application.name=${SPRING_APPLICATION_NAME:job_board_platform_backend}
server.port=${SERVER_PORT:5000}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_board_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

app.jwt.secret=${APP_JWT_SECRET:012345678901234567890123456789012345678901234567890123456789}
app.jwt.expiration-millis=${APP_JWT_EXPIRATION_MILLIS:3600000}
refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}