spring.application.name=${SPRING_APPLICATION_NAME:job_board_platform_backend}
server.port=${SERVER_PORT:5000}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_board_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.type.prefer_native_enum_types=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=false

app.jwt.secret=${APP_JWT_SECRET:012345678901234567890123456789012345678901234567890123456789}
app.jwt.expiration-millis=${APP_JWT_EXPIRATION_MILLIS:3600000}
refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000