$kind: http-request
name: 9. DELETE /applications/{id} — Rút đơn ứng tuyển
url: "{{baseUrl}}/applications/{{applicationId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{candidateAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Rút đơn — 200 hoặc 204', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
    language: text/javascript
order: 11000
