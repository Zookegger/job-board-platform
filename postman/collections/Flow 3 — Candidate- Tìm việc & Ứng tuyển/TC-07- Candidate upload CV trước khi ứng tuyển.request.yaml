$kind: http-request
name: "TC-07: Candidate upload CV trước khi ứng tuyển"
url: "{{baseUrl}}/profile/resume"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - C:\ThucTapCT Yoot\job-board-platform\server\postman\test-cv.pdf
    - type: text
      key: title
      value: CV Test Candidate
