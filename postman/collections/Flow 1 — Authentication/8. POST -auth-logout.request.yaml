$kind: http-request
name: 8. POST /auth/logout
url: "{{baseUrl}}/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{candidateAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Logout — 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 8000
