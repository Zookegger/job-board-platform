$kind: http-request
name: 4. PATCH /admin/reports/{reportId}/dismiss — Admin bác bỏ report
url: "{{baseUrl}}/admin/reports/{{reportId}}/dismiss"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reviewNotes": "Không đủ bằng chứng vi phạm, bác bỏ báo cáo."
    }
auth:
  type: bearer
  credentials:
    token: "{{adminAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Dismiss report — 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
