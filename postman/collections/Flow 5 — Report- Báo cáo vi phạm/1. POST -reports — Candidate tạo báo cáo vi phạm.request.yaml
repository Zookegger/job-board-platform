$kind: http-request
name: 1. POST /reports — Candidate tạo báo cáo vi phạm
url: "{{baseUrl}}/reports"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "jobId": "{{jobId}}",
      "reason": "SPAM",
      "details": "Job này yêu cầu đặt cọc tiền trước khi được nhận việc, có dấu hiệu lừa đảo."
    }
auth:
  type: bearer
  credentials:
    token: "{{candidateAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-20: Tạo report thành công — HTTP 200 hoặc 201', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      var json = pm.response.json();
      pm.test('Report có id', function () {
          pm.expect(json.id).to.be.a('string').and.not.empty;
      });
      pm.environment.set('reportId', json.id);
      pm.test('Reason là SPAM', function () {
          pm.expect(json.reason).to.eql('SPAM');
      });
    language: text/javascript
order: 3000
