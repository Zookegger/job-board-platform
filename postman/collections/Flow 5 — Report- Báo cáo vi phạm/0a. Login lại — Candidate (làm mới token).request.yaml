$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "testcandidate@flow1.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Re-login candidate — 200', function () {
          pm.response.to.have.status(200);
      });
      pm.environment.set('candidateAccessToken', pm.response.json().accessToken);
    language: text/javascript
order: 1000
