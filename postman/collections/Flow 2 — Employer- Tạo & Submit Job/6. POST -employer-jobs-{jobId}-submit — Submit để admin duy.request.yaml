$kind: http-request
name: 6. POST /employer/jobs/{jobId}/submit — Submit để admin duyệt
url: "{{baseUrl}}/employer/jobs/{{jobId}}/submit"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{employerAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Submit job — 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Submit thành công — trả về message', function () {
          pm.expect(pm.response.json().message).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 7000
