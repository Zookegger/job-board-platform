$kind: http-request
name: 2. GET /company/status — Trạng thái công ty
url: "{{baseUrl}}/company/status"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{employerAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Company status — 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Có trường approvalStatus', function () {
          pm.expect(pm.response.json()).to.have.property('approvalStatus');
      });
    language: text/javascript
order: 3000
