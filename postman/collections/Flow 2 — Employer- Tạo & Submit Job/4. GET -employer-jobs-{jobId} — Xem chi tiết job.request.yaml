$kind: http-request
name: 4. GET /employer/jobs/{jobId} — Xem chi tiết job
url: "{{baseUrl}}/employer/jobs/{{jobId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{employerAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Xem chi tiết job — 200', function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.test('ID khớp', function () {
          pm.expect(json.id).to.eql(pm.environment.get('jobId'));
      });
      pm.test('Status là DRAFT', function () {
          pm.expect(json.status).to.eql('DRAFT');
      });
    language: text/javascript
order: 5000
